services:
  dev_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: cv-baseimage-01
    container_name: ${PROJECT_NAME}-dev
    environment:
      - DISPLAY=$CONTAINER_DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/home/rosuser/.Xauthority
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "5678:5678"
    # Note: repo_out and catkin_ws/src/repo_ros are pre-created in the image but not
    # mounted here. They are mount targets for derived projects. The base image has
    # everything COPYed at build time; no host bind mount is needed.
    volumes:
      - ${DATASET_PATH}:/home/rosuser/dataset:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/home/rosuser/.Xauthority:rw
    command: /bin/bash
    stdin_open: true
    tty: true
